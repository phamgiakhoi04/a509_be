# Apply reviewed migrations manually before enabling this profile.
spring.jpa.hibernate.ddl-auto=validate
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.frontend-url=${APP_FRONTEND_URL}
# Wait for SMTP while the Vercel request is active.
app.mail.await-delivery=${APP_MAIL_AWAIT_DELIVERY:true}
spring.servlet.multipart.max-file-size=${APP_MULTIPART_MAX_FILE_SIZE:4MB}
spring.servlet.multipart.max-request-size=${APP_MULTIPART_MAX_REQUEST_SIZE:4MB}
