# Isolated in-memory database; no connection to the user's MySQL instance.
spring.datasource.url=jdbc:h2:mem:a509-tests;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.mail.username=sender@example.test
spring.mail.password=unused-test-value
cloudinary.cloud-name=test-cloud
cloudinary.api-key=unused-test-value
cloudinary.api-secret=unused-test-value
jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
