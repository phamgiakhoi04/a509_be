version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: a509_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: a509_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    external: true
    name: ${MYSQL_DATA_VOLUME:?Set MYSQL_DATA_VOLUME to the existing persisted MySQL volume}
